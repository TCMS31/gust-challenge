services:
  challenge:
    build:
      context: .
      dockerfile: Dockerfile
    image: gust-javascript-challenge:latest
    container_name: gust-javascript-challenge
    # Host 8720 -> nginx-unprivileged's default 8080.
    ports:
      - '${HOST_PORT:-8720}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
